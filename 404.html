<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="./styles.css">
  <title>Page not found · Qihong's Log</title>
</head>
<body>
  <main class="shell" style="min-height: 100vh; display: grid; place-items: center;">
    <section style="max-width: 620px; text-align: center;">
      <p class="eyebrow">404 · Page not found</p>
      <h1 style="margin: 0 0 24px; font: 500 clamp(52px, 10vw, 90px)/1 Georgia, serif; letter-spacing: -0.05em;">
        A blank page in the notebook.
      </h1>
      <p style="margin: 0 0 30px; color: var(--muted);">
        The page you were looking for has moved, or perhaps it has not been written yet.
      </p>
      <a class="primary-link" href="./">Return home <span aria-hidden="true">→</span></a>
    </section>
  </main>
</body>
</html>
